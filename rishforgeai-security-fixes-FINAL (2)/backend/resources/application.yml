# Root-level: values shared by every profile.
security:
  jwt:
    secret: ${JWT_SECRET}          # no fallback — startup fails loudly if unset
    expiration-minutes: 60
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

spring:
  jpa:
    hibernate:
      ddl-auto: update

---
# Demo profile: in-memory H2, h2-console enabled at the servlet level but
# still denied by SecurityConfig's requestMatchers("/h2-console/**").denyAll().
spring:
  config:
    activate:
      on-profile: demo
  datasource:
    url: jdbc:h2:mem:cyberrisk;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console

---
# Postgres profile: real credentials come from env, insecure defaults removed.
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cyberrisk}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME}      # no default — must be set explicitly
    password: ${DB_PASSWORD}      # no default — must be set explicitly
  h2:
    console:
      enabled: false
