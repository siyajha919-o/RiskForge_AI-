security:
  jwt:
    # Generate with: openssl rand -base64 64
    # No fallback default — startup fails loudly rather than running on a known key.
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  rate-limit:
    # Enable only when actually behind a reverse proxy; otherwise the header is spoofable.
    trust-forwarded-header: ${TRUST_FORWARDED_HEADER:false}
  admin-bootstrap:
    email: ${ADMIN_BOOTSTRAP_EMAIL:}
    password: ${ADMIN_BOOTSTRAP_PASSWORD:}

risk-engine:
  url: ${RISK_ENGINE_URL:http://localhost:8000}
  # Must match RISK_ENGINE_SHARED_SECRET on the Python side. Blank in local dev,
  # where api.py leaves the check disabled.
  shared-secret: ${RISK_ENGINE_SHARED_SECRET:}
  # The engine has no service-account mechanism — it authenticates callers with
  # the same bearer tokens it issues to the dashboard, so the backend signs in
  # as a regular engine user and refreshes the token when it expires.
  username: ${RISK_ENGINE_USERNAME:}
  password: ${RISK_ENGINE_PASSWORD:}

spring:
  application:
    name: cyber-risk-platform
  profiles:
    active: demo
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false

---
spring:
  config:
    activate:
      on-profile: demo
  datasource:
    url: jdbc:h2:mem:cyberrisk;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://localhost:5432/cyberrisk
    username: ${DB_USERNAME:cyberrisk}
    password: ${DB_PASSWORD:cyberrisk}
    driver-class-name: org.postgresql.Driver
